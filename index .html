<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puter To-Do</title>
<meta name="theme-color" content="#1f6f5c">
<style>
:root{
  --bg:#f4f6f5;--panel:#ffffff;--ink:#17211e;--mute:#66736f;--line:#d9e0dd;
  --acc:#1f6f5c;--acc-ink:#ffffff;--accbg:#e1f0eb;--bad:#b3362b;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#11171a;--panel:#1a2226;--ink:#e8efec;--mute:#93a29d;--line:#2c373c;
        --acc:#4cc2a1;--acc-ink:#0d1f1a;--accbg:#1d3a33;--bad:#ef8579}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{margin:0;font-size:28px;letter-spacing:-.02em}
button,input{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:9px 14px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input[type=text]{width:100%;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.user{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:14px}
.user b{color:var(--ink)}
.user button{padding:5px 10px;font-size:13px}
#auth{text-align:center;padding:36px 20px}
#auth p{color:var(--mute);margin:8px 0 20px}
.add{display:flex;gap:8px;margin-bottom:14px}
.add button{flex:0 0 auto}
.filters{display:flex;gap:6px;margin-bottom:12px}
.filters button{padding:6px 12px;font-size:14px}
.filters button[aria-pressed=true]{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:600}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
li input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc);flex:0 0 auto;cursor:pointer}
li .text{flex:1;min-width:0;overflow-wrap:anywhere}
li.done .text{text-decoration:line-through;color:var(--mute)}
li .icon{padding:4px 9px;font-size:14px;color:var(--mute)}
li .icon.del:hover{color:var(--bad);border-color:var(--bad)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;
  color:var(--mute);font-size:14px;gap:8px}
.foot button{font-size:13px;padding:5px 10px}
.empty{text-align:center;color:var(--mute);padding:28px 8px}
#status{min-height:22px;font-size:14px;color:var(--mute);margin:0 0 8px}
#status.err{color:var(--bad)}
.note{font-size:13px;color:var(--mute);margin-top:14px}
footer{text-align:center;margin-top:28px;font-size:13px;color:var(--mute)}
footer a{color:var(--acc)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header>
    <h1>To-Do</h1>
    <div class="user" id="user" hidden>
      <span>Signed in as <b id="uname"></b></span>
      <button id="signout" type="button">Sign out</button>
    </div>
  </header>

  <section id="auth" class="card" hidden>
    <h2 style="margin:0;font-size:20px">Your tasks, in your own Puter account</h2>
    <p>Sign in with Puter to save your list in the cloud and open it on any device.</p>
    <button id="signin" type="button" class="primary">Sign in with Puter</button>
    <div class="note" id="authnote"></div>
  </section>

  <section id="app" hidden>
    <form class="add" id="addform" autocomplete="off">
      <input type="text" id="newtext" placeholder="What needs doing?" maxlength="300" aria-label="New task">
      <button type="submit" class="primary">Add</button>
    </form>
    <div class="filters" role="group" aria-label="Filter tasks">
      <button type="button" data-f="all" aria-pressed="true">All</button>
      <button type="button" data-f="active" aria-pressed="false">Active</button>
      <button type="button" data-f="done" aria-pressed="false">Done</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
    <ul id="list"></ul>
    <div class="foot">
      <span id="count"></span>
      <button type="button" id="clear">Clear completed</button>
    </div>
  </section>

  <footer>Powered by <a href="https://developer.puter.com" target="_blank" rel="noopener">Puter</a></footer>
</main>

<script src="https://js.puter.com/v2/"></script>
<script>
(function(){
  var KEY = 'todos';           // one kv key: an object of { [id]: {text, done, at} }
  var items = [];
  var filter = 'all';
  var editingId = null;
  var $ = function(id){ return document.getElementById(id); };

  function msg(e){ return (e && (e.msg || e.message || e.error)) || String(e); }
  function newId(){
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  }
  function setStatus(text, isErr){
    var s = $('status');
    s.textContent = text || '';
    s.className = isErr ? 'err' : '';
  }
  function show(signed){
    $('auth').hidden = signed;
    $('app').hidden = !signed;
    $('user').hidden = !signed;
  }

  /* ---------- data ---------- */
  async function load(){
    setStatus('Loading…');
    try {
      var data = (await puter.kv.get(KEY)) || {};
      items = Object.keys(data)
        .map(function(id){ var t = data[id]; return t && { id: id, text: t.text, done: !!t.done, at: t.at }; })
        // skip leftovers from an edit that reached an item another tab already deleted
        .filter(function(t){ return t && t.at !== undefined && typeof t.text === 'string'; })
        .sort(function(a, b){ return a.at - b.at; });
      setStatus('');
    } catch (e) {
      setStatus('Could not load your tasks: ' + msg(e), true);
    }
    render();
  }

  // Optimistic update already applied; if saving fails, show the error and reload the truth.
  async function save(fn){
    try { await fn(); }
    catch (e) { setStatus('Could not save: ' + msg(e), true); await load(); }
  }

  function addItem(text){
    var item = { id: newId(), text: text, done: false, at: Date.now() };
    items.push(item);
    render();
    var payload = {};
    payload[item.id] = { text: item.text, done: false, at: item.at };
    save(function(){ return puter.kv.update(KEY, payload); });
  }
  function toggle(item){
    item.done = !item.done;
    render();
    var p = {}; p[item.id + '.done'] = item.done;
    save(function(){ return puter.kv.update(KEY, p); });
  }
  function rename(item, text){
    if (text && text !== item.text) {
      item.text = text;
      var p = {}; p[item.id + '.text'] = text;
      save(function(){ return puter.kv.update(KEY, p); });
    }
    editingId = null;
    render();
  }
  function remove(item){
    items = items.filter(function(t){ return t.id !== item.id; });
    render();
    save(function(){ return puter.kv.remove(KEY, item.id); });
  }
  function clearDone(){
    var ids = items.filter(function(t){ return t.done; }).map(function(t){ return t.id; });
    if (!ids.length) return;
    items = items.filter(function(t){ return !t.done; });
    render();
    save(function(){ return puter.kv.remove.apply(puter.kv, [KEY].concat(ids)); });
  }

  /* ---------- view ---------- */
  function render(){
    var list = $('list');
    list.textContent = '';
    var visible = items.filter(function(t){
      return filter === 'all' || (filter === 'done' ? t.done : !t.done);
    });

    if (!visible.length) {
      var li = document.createElement('li');
      li.className = 'empty';
      li.style.display = 'block';
      li.textContent = items.length ? 'Nothing in this view.' : 'No tasks yet. Add your first one above.';
      list.appendChild(li);
    }

    visible.forEach(function(item){
      var li = document.createElement('li');
      if (item.done) li.className = 'done';

      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = item.done;
      cb.setAttribute('aria-label', 'Mark done');
      cb.addEventListener('change', function(){ toggle(item); });
      li.appendChild(cb);

      if (editingId === item.id) {
        var inp = document.createElement('input');
        inp.type = 'text';
        inp.value = item.text;
        inp.maxLength = 300;
        inp.setAttribute('aria-label', 'Edit task');
        inp.addEventListener('keydown', function(e){
          if (e.key === 'Enter') rename(item, inp.value.trim());
          if (e.key === 'Escape') { editingId = null; render(); }
        });
        li.appendChild(inp);
        var ok = document.createElement('button');
        ok.type = 'button'; ok.className = 'icon'; ok.textContent = 'Save';
        ok.addEventListener('click', function(){ rename(item, inp.value.trim()); });
        li.appendChild(ok);
        setTimeout(function(){ inp.focus(); inp.select(); }, 0);
      } else {
        var span = document.createElement('span');
        span.className = 'text';
        span.textContent = item.text;
        span.addEventListener('dblclick', function(){ editingId = item.id; render(); });
        li.appendChild(span);

        var ed = document.createElement('button');
        ed.type = 'button'; ed.className = 'icon'; ed.textContent = 'Edit';
        ed.addEventListener('click', function(){ editingId = item.id; render(); });
        li.appendChild(ed);

        var del = document.createElement('button');
        del.type = 'button'; del.className = 'icon del'; del.textContent = '×';
        del.setAttribute('aria-label', 'Delete task');
        del.addEventListener('click', function(){ remove(item); });
        li.appendChild(del);
      }
      list.appendChild(li);
    });

    var left = items.filter(function(t){ return !t.done; }).length;
    $('count').textContent = left + (left === 1 ? ' task left' : ' tasks left');
    $('clear').hidden = !items.some(function(t){ return t.done; });
    Array.prototype.forEach.call(document.querySelectorAll('.filters button'), function(b){
      b.setAttribute('aria-pressed', String(b.getAttribute('data-f') === filter));
    });
  }

  /* ---------- auth ---------- */
  async function enter(){
    show(true);
    try {
      var u = await puter.auth.getUser();
      $('uname').textContent = (u && u.username) || 'you';
    } catch (e) {}
    await load();
  }

  async function boot(){
    if (location.protocol === 'file:') {
      show(false);
      $('authnote').textContent = 'Puter apps must be served over HTTP, not opened from a file. Host this page (for example on Puter hosting) or run a local server such as "python3 -m http.server".';
      $('signin').disabled = true;
      return;
    }
    var signed = false;
    try { signed = await puter.auth.isSignedIn(); } catch (e) {}
    if (signed) await enter(); else show(false);
  }

  $('signin').addEventListener('click', async function(){
    $('authnote').textContent = '';
    try {
      await puter.auth.signIn();   // opens a popup; must come from a click
      await enter();
    } catch (e) {
      var code = e && e.error;
      $('authnote').textContent =
        code === 'popup_blocked' ? 'Your browser blocked the sign-in popup. Allow popups for this page and try again.' :
        code === 'auth_window_closed' ? 'Sign-in was cancelled.' :
        'Sign-in failed: ' + msg(e);
    }
  });

  $('signout').addEventListener('click', async function(){
    try { await puter.auth.signOut(); } catch (e) {}
    items = [];
    editingId = null;
    show(false);
  });

  /* ---------- events ---------- */
  $('addform').addEventListener('submit', function(e){
    e.preventDefault();
    var inp = $('newtext');
    var text = inp.value.trim();
    if (!text) return;
    inp.value = '';
    addItem(text);
  });
  $('clear').addEventListener('click', clearDone);
  Array.prototype.forEach.call(document.querySelectorAll('.filters button'), function(b){
    b.addEventListener('click', function(){ filter = b.getAttribute('data-f'); render(); });
  });
  // pick up changes made on another device or tab when you come back to this one
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden && !$('app').hidden && editingId === null) load();
  });

  render();
  boot();
})();
</script>
</body>
</html>
